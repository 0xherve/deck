# Release
#
# How GitHub Actions workflows work (quick map):
#   on:        when this file runs (here: pushing a version tag)
#   jobs:      parallel units of work
#   steps:     sequential commands inside a job
#   permissions: grants GitHub OIDC access for npm Trusted Publishing
#
# Before your first release:
#   1. Configure npm Trusted Publishing for:
#      - owner/repo: 0xherve/deck
#      - workflow filename: release.yml
#      - allowed action: npm publish
#   2. Bump version in package.json, commit, tag: git tag v0.1.0 && git push origin v0.1.0
#
# Tag format must match `on.push.tags` below.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || {
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          }

      - name: Verify and build
        run: |
          bun run typecheck
          bun run build
          node dist/cli.js list

      - name: Publish to npm
        run: npm publish --access public
