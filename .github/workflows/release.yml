# Release — YOU finish the steps marked TODO.
#
# How GitHub Actions workflows work (quick map):
#   on:        when this file runs (here: pushing a version tag)
#   jobs:      parallel units of work
#   steps:     sequential commands inside a job
#   secrets:   credentials (NPM_TOKEN) stored in repo Settings → Secrets
#
# Before your first release:
#   1. Create an npm account + package name "deck" (or change name in package.json)
#   2. npm login locally once to verify publish works: npm publish --dry-run
#   3. Create NPM_TOKEN at npmjs.com → Access Tokens (Automation type for CI)
#   4. Add NPM_TOKEN to GitHub repo → Settings → Secrets and variables → Actions
#   5. Bump version in package.json, commit, tag: git tag v0.1.0 && git push origin v0.1.0
#
# Tag format must match `on.push.tags` below.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write 

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify build
        run: |
          bun run typecheck
          bun run build
          node dist/cli.js list

      # TODO: ensure package.json version matches the git tag.
      # Example: tag v0.1.0 → package.json must say "0.1.0" (no leading v).
      # YOU: add a step that fails if they disagree, e.g.:
      #   TAG="${GITHUB_REF_NAME#v}"
      #   PKG=$(node -p "require('./package.json').version")
      #   test "$TAG" = "$PKG" || exit 1

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # YOU: create NPM_TOKEN secret before this will work.
        # First publish of a scoped package needs --access public; unscoped "deck" is public by default.

      # TODO: Create a GitHub Release (optional but nice for users).
